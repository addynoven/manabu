name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: defaultdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd web && bun install

      - name: Typecheck
        run: cd web && bun run typecheck

      - name: Setup CI Database Schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d defaultdb -c "CREATE SCHEMA IF NOT EXISTS manabu;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d defaultdb -c "
            CREATE TABLE IF NOT EXISTS manabu.profiles (
              uid varchar(128) PRIMARY KEY,
              email varchar(255),
              display_name varchar(255) NOT NULL,
              avatar_emoji varchar(32) DEFAULT '居',
              belt_rank varchar(32) DEFAULT 'white',
              level integer DEFAULT 1,
              total_xp integer DEFAULT 0,
              weekly_xp integer DEFAULT 0,
              week_id varchar(16),
              current_streak integer DEFAULT 0,
              last_active_date varchar(32),
              daily_date varchar(32),
              daily_score integer,
              daily_time_sec integer,
              daily_accuracy numeric,
              friend_code varchar(32) UNIQUE,
              desired_retention numeric DEFAULT 0.90,
              banned boolean DEFAULT false,
              created_at timestamp DEFAULT now(),
              updated_at timestamp DEFAULT now()
            );
            CREATE TABLE IF NOT EXISTS manabu.card_states (
              uid varchar(128) NOT NULL,
              card_id varchar(128) NOT NULL,
              card_type varchar(32) NOT NULL DEFAULT 'vocab',
              state varchar(32) NOT NULL DEFAULT 'new',
              stability numeric NOT NULL DEFAULT 0.4,
              difficulty numeric NOT NULL DEFAULT 5.0,
              reps integer NOT NULL DEFAULT 0,
              lapses integer NOT NULL DEFAULT 0,
              last_review timestamp,
              due_at timestamp NOT NULL DEFAULT now(),
              PRIMARY KEY (uid, card_id)
            );
            CREATE TABLE IF NOT EXISTS manabu.review_logs (
              id bigserial PRIMARY KEY,
              uid varchar(128) NOT NULL,
              card_id varchar(128) NOT NULL,
              rating integer NOT NULL,
              state varchar(32) NOT NULL,
              elapsed_days numeric NOT NULL,
              scheduled_days numeric NOT NULL,
              reviewed_at timestamp NOT NULL DEFAULT now()
            );
            CREATE TABLE IF NOT EXISTS manabu.friendships (
              user_a varchar(128) NOT NULL,
              user_b varchar(128) NOT NULL,
              created_at timestamp DEFAULT now(),
              PRIMARY KEY (user_a, user_b)
            );
            CREATE TABLE IF NOT EXISTS manabu.friend_requests (
              id serial PRIMARY KEY,
              from_uid varchar(128) NOT NULL,
              to_uid varchar(128) NOT NULL,
              status varchar(32) NOT NULL DEFAULT 'pending',
              created_at timestamp DEFAULT now(),
              responded_at timestamp
            );
            CREATE TABLE IF NOT EXISTS manabu.score_challenges (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              game varchar(32) NOT NULL,
              mode varchar(32) DEFAULT 'default',
              creator_uid varchar(128) NOT NULL,
              target_uid varchar(128) NOT NULL,
              creator_score integer NOT NULL,
              target_score integer,
              status varchar(32) DEFAULT 'pending',
              created_at timestamp DEFAULT now(),
              expiresAt timestamp,
              completedAt timestamp
            );
            CREATE TABLE IF NOT EXISTS manabu.match_results (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              game varchar(32) NOT NULL,
              player_a varchar(128) NOT NULL,
              player_b varchar(128) NOT NULL,
              wins_a integer NOT NULL DEFAULT 0,
              wins_b integer NOT NULL DEFAULT 0,
              winner varchar(128),
              reason varchar(32),
              rounds integer DEFAULT 1,
              started_at timestamp,
              ended_at timestamp DEFAULT now()
            );
            CREATE TABLE IF NOT EXISTS manabu.app_config (
              key varchar(128) PRIMARY KEY,
              value jsonb
            );
            CREATE TABLE IF NOT EXISTS manabu.user_backups (
              uid varchar(128) PRIMARY KEY,
              backup_data jsonb NOT NULL,
              version integer DEFAULT 1,
              synced_at timestamp DEFAULT now()
            );
          "

      - name: Test
        run: cd web && bun run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/defaultdb

      - name: Build
        run: cd web && bun run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/defaultdb
